<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Price Testing — Wealth Builder</title>
    <style>
        body {
            background-color: #FFFFFF;
            color: #008000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            border-bottom: 2px solid #008000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #008000;
            background: #fff;
            color: #008000;
            box-sizing: border-box;
        }
        button {
            background-color: #008000;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #008000;
            background: #f9f9f9;
        }
        .progress-container {
            width: 100%;
            background-color: #f3f3f3;
            border: 1px solid #008000;
            margin-top: 10px;
        }
        .progress-bar {
            width: 0%;
            height: 20px;
            background-color: #008000;
            transition: width 0.3s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #008000;
            padding: 8px;
            text-align: left;
        }
        .status-success { color: #008000; font-weight: bold; }
        .status-error { color: #FF0000; font-weight: bold; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #008000;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>API Price Testing (NSE ISINs)</h1>

        <button id="startBtn">Start Testing All ISINs</button>

        <div id="status">
            Click Start to begin.
        </div>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="summary"></div>

        <div id="resultsTableContainer"></div>

        <a href="index.html" class="back-link">← Back to Valuation Tool</a>
    </div>
    <script src="test-prices.js"></script>
</body>
</html>
